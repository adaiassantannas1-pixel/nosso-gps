<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeCasal 360 ELITE - Geofencing</title>

    <!-- Meta Tags PWA / iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <!-- Leaflet & FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.92);
            --border-light: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-dark); color: white; }

        /* TELA DE LOGIN PROFISSIONAL */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-light);
            padding: 35px 30px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); backdrop-filter: blur(16px);
        }
        .login-card .brand-icon {
            width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 1.8rem; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
        .login-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .login-card p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { font-size: 0.75rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border-light);
            background: rgba(15, 23, 42, 0.6); color: white; outline: none; font-size: 0.95rem;
        }
        .btn-primary {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* MAPA 2D */
        #map { width: 100%; height: 100%; flex: 1; z-index: 1; }

        /* HUD SUPERIOR */
        .glass-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--card-bg); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 40px; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 92%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header-profile { display: flex; align-items: center; gap: 10px; }
        .header-avatar {
            width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary);
            background-size: cover; background-position: center;
        }
        .btn-sos-header {
            padding: 8px 16px; border-radius: 30px; background: var(--danger); color: white;
            border: 2px solid #fca5a5; font-size: 0.8rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); animation: pulse-sos 1.5s infinite;
        }
        @keyframes pulse-sos { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* BANNER DE NOTIFICAÇÃO DE CHEGADA / SAÍDA EM LUGARES */
        #place-notification-banner {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 1001; background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px;
            display: none; align-items: center; gap: 10px; font-weight: 700; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6); border: 1px solid rgba(255,255,255,0.3);
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

        #sos-banner {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 1001; background: var(--danger); color: white; padding: 10px 20px; border-radius: 30px;
            display: none; align-items: center; gap: 15px; font-weight: 800; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6); border: 2px solid #fff;
        }
        body.sos-active { animation: siren-flash 0.5s infinite alternate !important; }
        @keyframes siren-flash { 0% { background: #7f1d1d; } 100% { background: #1e3a8a; } }

        /* MARCADOR LIFE */
        .life-marker {
            position: relative; width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid var(--primary); background-size: cover; background-position: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .life-marker.parceiro { border-color: #3b82f6; }
        .marker-badge {
            position: absolute; bottom: -2px; right: -2px; background: #10b981; color: white;
            width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; display: flex;
            align-items: center; justify-content: center; border: 2px solid #0f172a;
        }
        .battery-badge {
            position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); color: #fff; padding: 1px 6px; border-radius: 8px;
            font-size: 0.65rem; font-weight: 700; border: 1px solid var(--border-light); display: flex; align-items: center; gap: 3px;
        }

        /* HUD BOTTOM */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--card-bg); backdrop-filter: blur(16px);
            padding: 12px 20px; border-radius: 24px; border: 1px solid var(--border-light);
            display: flex; justify-content: space-around; align-items: center;
            width: 92%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 0.65rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
        .hud-value { font-size: 1rem; font-weight: 800; color: #fff; }

        .controls-bar { position: absolute; bottom: 105px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .btn-round {
            width: 46px; height: 46px; border-radius: 50%; background: var(--card-bg);
            border: 1px solid var(--border-light); color: white; backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }

        /* PAINEL LATERAL MULTI-ABAS */
        .sidebar {
            position: fixed; top: 0; right: -420px; width: 380px; height: 100%;
            background: rgba(15, 23, 42, 0.97); backdrop-filter: blur(20px); z-index: 3000;
            border-left: 1px solid var(--border-light); padding: 20px;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 15px;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
        }
        .sidebar.open { right: 0 !important; }
        
        .tab-menu { display: flex; gap: 4px; background: rgba(30, 41, 59, 0.8); padding: 4px; border-radius: 14px; border: 1px solid var(--border-light); }
        .tab-btn { flex: 1; padding: 8px 2px; border: none; background: none; color: #94a3b8; font-weight: 700; font-size: 0.7rem; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #fff; }

        .tab-content { display: none; flex: 1; flex-direction: column; gap: 12px; overflow-y: auto; }
        .tab-content.active { display: flex; }

        /* CARDS DO SISTEMA */
        .place-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-light); padding: 12px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; }
        .stop-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-light); padding: 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 6px; }
        
        /* CHAT estilo WHATSAPP */
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .msg-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.85rem; line-height: 1.35; position: relative; }
        .msg-bubble .sender-name { font-size: 0.7rem; font-weight: 800; margin-bottom: 3px; color: #a5b4fc; }
        .msg-bubble .meta { font-size: 0.65rem; opacity: 0.75; text-align: right; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .msg-bubble.me { background: #4f46e5; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-bubble.other { background: rgba(30, 41, 59, 0.95); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-light); }
        .chat-input-box { display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-light); background: rgba(15, 23, 42, 0.8); color: white; outline: none; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="brand-icon"><i class="fa-solid fa-location-crosshairs"></i></div>
            <h2>LifeCasal 360 ELITE</h2>
            <p>Monitoramento e Geofencing de Lugares</p>
            
            <div class="input-group">
                <label>Nome de Usuário</label>
                <input type="text" id="login-user" placeholder="Ex: Lucas">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="******">
            </div>
            <div class="input-group">
                <label>Perfil no App</label>
                <select id="login-perfil">
                    <option value="pessoa1">Pessoa 1 💖</option>
                    <option value="pessoa2">Pessoa 2 💙</option>
                </select>
            </div>
            <button class="btn-primary" onclick="autenticarUsuario()">Entrar no Círculo</button>
            <div id="login-error" style="color:var(--danger); font-size:0.8rem; margin-top:12px; font-weight:600;"></div>
        </div>
    </div>

    <!-- HUD SUPERIOR -->
    <div class="glass-header">
        <div class="header-profile">
            <div class="header-avatar" id="header-avatar-img"></div>
            <div>
                <div id="label-usuario" style="font-weight:800; font-size:0.85rem;">Conectando...</div>
                <div id="status-rede" style="font-size:0.65rem; color:var(--success); display:flex; align-items:center; gap:4px;">
                    <i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Conectado
                </div>
            </div>
        </div>
        <button class="btn-sos-header" onclick="dispararSOS()">SOS 🚨</button>
    </div>

    <!-- NOTIFICAÇÃO DE GEOFENCING (CHEGADA / SAÍDA DE LUGARES) -->
    <div id="place-notification-banner">
        <i class="fa-solid fa-bell"></i> <span id="place-notification-text">Amor chegou em Casa</span>
    </div>

    <!-- BANNER SOS -->
    <div id="sos-banner">
        <span>🚨 EMERGÊNCIA ATIVADA!</span>
        <button onclick="pararSOS()" style="background:#fff; color:var(--danger); border:none; padding:6px 14px; border-radius:20px; font-weight:800; cursor:pointer;">PARAR</button>
    </div>

    <!-- MAPA 2D -->
    <div id="map"></div>

    <!-- CONTROLES -->
    <div class="controls-bar">
        <button class="btn-round" id="btn-recenter" title="Minha Localização"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="btn-round" id="btn-fit-all" title="Ver Ambos"><i class="fa-solid fa-users"></i></button>
        <button class="btn-round" id="btn-sidebar" title="Menu e Painel"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- HUD BOTTOM -->
    <div class="hud-bottom">
        <div class="hud-item">
            <div class="hud-value" id="stat-speed">0 <span style="font-size:0.7rem;">km/h</span></div>
            <div class="hud-label">Velocidade</div>
        </div>
        <div style="width:1px; height:25px; background:var(--border-light);"></div>
        <div class="hud-item">
            <div class="hud-value" id="stat-mode" style="color:#6366f1;"><i class="fa-solid fa-person-walking"></i></div>
            <div class="hud-label" id="stat-mode-text">Parado</div>
        </div>
        <div style="width:1px; height:25px; background:var(--border-light);"></div>
        <div class="hud-item">
            <div class="hud-value" id="stat-dist" style="color:var(--success);">0 m</div>
            <div class="hud-label">Distância</div>
        </div>
    </div>

    <!-- PAINEL LATERAL MULTI-ABAS -->
    <div class="sidebar" id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-weight:800; font-size:1.1rem;">Painel do Casal</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:1.3rem; color:#94a3b8;" id="btn-close-sidebar"></i>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="trocarAba('tab-lugares', this)">Lugares 🏠</button>
            <button class="tab-btn" onclick="trocarAba('tab-paradas', this)">Paradas 📍</button>
            <button class="tab-btn" onclick="trocarAba('tab-chat', this)">Chat 💬</button>
            <button class="tab-btn" onclick="trocarAba('tab-config', this)">Perfil 👤</button>
        </div>

        <!-- ABA LUGARES (GEOFENCING) -->
        <div class="tab-content active" id="tab-lugares">
            <button class="btn-primary" onclick="cadastrarLugarAtual()"><i class="fa-solid fa-location-dot"></i> Salvar Local Atual como Lugar</button>
            <div style="font-size:0.75rem; font-weight:700; color:#94a3b8; margin-top:10px;">LUGARES CADASTRADOS (CASA, ESCOLA, TRABALHO)</div>
            <div id="places-container" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- ABA PARADAS -->
        <div class="tab-content" id="tab-paradas">
            <div style="font-size:0.8rem; font-weight:700; color:#94a3b8;">HISTÓRICO DE ENDEREÇOS E PARADAS</div>
            <div id="stops-container" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>

        <!-- ABA CHAT -->
        <div class="tab-content" id="tab-chat">
            <div class="chat-messages" id="chat-container"></div>
            <div class="chat-input-box">
                <input type="text" id="chat-input" placeholder="Mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
                <button class="btn-primary" style="width:auto; padding:0 16px; margin:0;" onclick="enviarMensagem()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- ABA PERFIL -->
        <div class="tab-content" id="tab-config">
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; background:rgba(30,41,59,0.5); padding:15px; border-radius:18px;">
                <div id="profile-preview" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--primary); background-size:cover; background-position:center;"></div>
                <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="processarFoto(event)">
                <button class="btn-primary" style="padding:8px; font-size:0.8rem;" onclick="document.getElementById('file-input').click()">📷 Alterar Foto</button>
            </div>
            <button class="btn-primary" style="background:var(--danger); margin-top:auto;" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button>
        </div>
    </div>

    <!-- Leaflet & Firebase SDKs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDm3HCp_dc6C1an3qdiYKrNHAjvjnhSe3U",
            authDomain: "nosso-gps.firebaseapp.com",
            databaseURL: "https://nosso-gps-default-rtdb.firebaseio.com",
            projectId: "nosso-gps",
            storageBucket: "nosso-gps.firebasestorage.app",
            messagingSenderId: "311157140126",
            appId: "1:311157140126:web:01a483db11a6d9b24fe98f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let meuPerfil = 'pessoa1', parceiroPerfil = 'pessoa2', meuUsuario = '';
        let meuMarcador = null, marcadorParceiro = null;
        let minhaUltimaPos = null, parceiroUltimaPos = null;
        let fotoPerfilUrl = '', bateriaNivel = 100;
        let lugaresCadastrados = {};
        let lugarAtualParceiro = null;

        // 2. Mapa 2D
        const map = L.map('map', { zoomControl: false }).setView([-14.2350, -51.9253], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB', maxZoom: 19
        }).addTo(map);

        // Bateria
        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                bateriaNivel = Math.round(b.level * 100);
                b.addEventListener('levelchange', () => { bateriaNivel = Math.round(b.level * 100); });
            });
        }

        // Login
        function autenticarUsuario() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            meuPerfil = document.getElementById('login-perfil').value;
            parceiroPerfil = meuPerfil === 'pessoa1' ? 'pessoa2' : 'pessoa1';

            if (!user || !pass) {
                document.getElementById('login-error').innerText = "Informe usuário e senha!";
                return;
            }

            db.ref('usuarios/' + user).once('value', (snap) => {
                const d = snap.val();
                if (d && d.senha !== pass) {
                    document.getElementById('login-error').innerText = "Senha incorreta!";
                    return;
                }
                if (!d) db.ref('usuarios/' + user).set({ senha: pass, perfil: meuPerfil });

                meuUsuario = user;
                localStorage.setItem('life_user', user);
                localStorage.setItem('life_perfil', meuPerfil);

                document.getElementById('label-usuario').innerText = `${user} (${meuPerfil === 'pessoa1' ? '💖' : '💙'})`;
                document.getElementById('login-screen').style.display = 'none';

                iniciarRastreamentoGPS();
                escutarParceiro();
                escutarSOS();
                escutarChat();
                carregarLugares();
                carregarFoto();
                carregarParadas();
            });
        }

        function fazerLogout() { localStorage.clear(); location.reload(); }
        if (localStorage.getItem('life_user')) {
            document.getElementById('login-user').value = localStorage.getItem('life_user');
            document.getElementById('login-perfil').value = localStorage.getItem('life_perfil') || 'pessoa1';
        }

        // 3. SISTEMA DE GEOFENCING E NOTIFICAÇÃO DE LUGARES
        function cadastrarLugarAtual() {
            if (!minhaUltimaPos) { alert("Aguardando localização do GPS..."); return; }
            const nomeLugar = prompt("Qual o nome deste lugar? (Ex: Casa, Faculdade, Trabalho, Escola):");
            if (!nomeLugar) return;

            db.ref('lugares').push({
                nome: nomeLugar,
                lat: minhaUltimaPos[0],
                lng: minhaUltimaPos[1],
                raio: 100 // Raio de 100 metros
            });
        }

        function carregarLugares() {
            db.ref('lugares').on('value', (snap) => {
                const container = document.getElementById('places-container');
                container.innerHTML = '';
                lugaresCadastrados = snap.val() || {};

                snap.forEach((child) => {
                    const place = child.val();
                    const key = child.key;

                    // Desenha o círculo do lugar no mapa
                    L.circle([place.lat, place.lng], {
                        color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.15, radius: place.raio || 100
                    }).addTo(map).bindPopup(`<b>${place.nome}</b>`);

                    const card = document.createElement('div');
                    card.className = 'place-card';
                    card.innerHTML = `
                        <div>
                            <div style="font-weight:800; font-size:0.9rem;"><i class="fa-solid fa-house"></i> ${place.nome}</div>
                            <div style="font-size:0.7rem; color:#94a3b8;">Raio de detecção: ${place.raio || 100}m</div>
                        </div>
                        <button style="background:none; border:none; color:var(--danger); cursor:pointer;" onclick="removerLugar('${key}')"><i class="fa-solid fa-trash"></i></button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function removerLugar(key) { db.ref('lugares/' + key).remove(); }

        function checarLugaresParceiro(lat, lng) {
            let lugarDetectado = null;
            Object.values(lugaresCadastrados).forEach(place => {
                const d = calcularDistancia(lat, lng, place.lat, place.lng);
                if (d <= (place.raio || 100)) {
                    lugarDetectado = place.nome;
                }
            });

            if (lugarDetectado !== lugarAtualParceiro) {
                if (lugarDetectado) {
                    exibirNotificacaoLugar(`Amor chegou em ${lugarDetectado} 🏠`);
                } else if (lugarAtualParceiro) {
                    exibirNotificacaoLugar(`Amor saiu de ${lugarAtualParceiro} 🚗`);
                }
                lugarAtualParceiro = lugarDetectado;
            }
            return lugarDetectado;
        }

        function exibirNotificacaoLugar(texto) {
            const banner = document.getElementById('place-notification-banner');
            document.getElementById('place-notification-text').innerText = texto;
            banner.style.display = 'flex';
            setTimeout(() => { banner.style.display = 'none'; }, 6000);
        }

        // 4. GPS E DISTÂNCIA
        function criarMarcadorLife(urlFoto, modoIcone, bat, eParceiro = false) {
            const img = urlFoto || `https://ui-avatars.com/api/?name=${eParceiro?'Amor':'Voce'}&background=${eParceiro?'3b82f6':'6366f1'}&color=fff`;
            return L.divIcon({
                className: 'custom-icon-wrapper',
                html: `<div class="life-marker ${eParceiro ? 'parceiro' : ''}" style="background-image: url('${img}');">
                        <div class="battery-badge"><i class="fa-solid fa-battery-three-quarters"></i> ${bat}%</div>
                        <div class="marker-badge"><i class="fa-solid ${modoIcone}"></i></div>
                       </div>`,
                iconSize: [56, 56], iconAnchor: [28, 28]
            });
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function iniciarRastreamentoGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude, prec = pos.coords.accuracy;
                    if (prec > 35) return;

                    let v = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
                    minhaUltimaPos = [lat, lng];

                    const modoIcone = v > 2 ? (v > 30 ? 'fa-car' : 'fa-motorcycle') : 'fa-person-walking';
                    document.getElementById('stat-speed').innerHTML = `${v.toFixed(0)} <span style="font-size:0.7rem;">km/h</span>`;

                    if (!meuMarcador) {
                        meuMarcador = L.marker([lat, lng], { icon: criarMarcadorLife(fotoPerfilUrl, modoIcone, bateriaNivel) }).addTo(map);
                        map.setView([lat, lng], 16);
                    } else {
                        meuMarcador.setLatLng([lat, lng]);
                        meuMarcador.setIcon(criarMarcadorLife(fotoPerfilUrl, modoIcone, bateriaNivel));
                    }

                    db.ref('casal/' + meuPerfil).set({
                        lat: lat, lng: lng, speed: v, modoIcone: modoIcone,
                        foto: fotoPerfilUrl, bateria: bateriaNivel, timestamp: Date.now()
                    });

                    atualizarDistancia();
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function escutarParceiro() {
            db.ref('casal/' + parceiroPerfil).on('value', (snap) => {
                const d = snap.val();
                if (!d || !d.lat) return;

                parceiroUltimaPos = [d.lat, d.lng];
                const lugarNome = checarLugaresParceiro(d.lat, d.lng);

                document.getElementById('stat-mode-text').innerText = lugarNome ? lugarNome : (d.speed > 2 ? 'Em Movimento' : 'Parado');

                if (!marcadorParceiro) {
                    marcadorParceiro = L.marker([d.lat, d.lng], { icon: criarMarcadorLife(d.foto, d.modoIcone || 'fa-person-walking', d.bateria || 100, true) }).addTo(map);
                } else {
                    marcadorParceiro.setLatLng([d.lat, d.lng]);
                    marcadorParceiro.setIcon(criarMarcadorLife(d.foto, d.modoIcone || 'fa-person-walking', d.bateria || 100, true));
                }
                atualizarDistancia();
            });
        }

        // 5. CHAT
        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto) return;

            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            db.ref('chat').push({ emissor: meuUsuario, perfil: meuPerfil, mensagem: texto, hora: hora, timestamp: Date.now() });
            input.value = '';
        }

        function escutarChat() {
            db.ref('chat').limitToLast(30).on('value', (snap) => {
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                snap.forEach((child) => {
                    const m = child.val();
                    const isMe = m.perfil === meuPerfil;
                    const bubble = document.createElement('div');
                    bubble.className = `msg-bubble ${isMe ? 'me' : 'other'}`;
                    bubble.innerHTML = `<div class="sender-name">${isMe ? 'Você' : m.emissor}</div><div>${m.mensagem}</div><div class="meta">${m.hora}</div>`;
                    container.appendChild(bubble);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        // 6. SOS SINGLETON
        let audioCtx = null, sirenOsc = null;
        function tocarSirene() {
            if (sirenOsc) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sirenOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            sirenOsc.type = 'sawtooth'; sirenOsc.connect(gain); gain.connect(audioCtx.destination); sirenOsc.start();
        }
        function desligarSirene() {
            if (sirenOsc) { sirenOsc.stop(); sirenOsc.disconnect(); sirenOsc = null; }
            document.body.classList.remove('sos-active');
            document.getElementById('sos-banner').style.display = 'none';
        }
        function dispararSOS() { db.ref('alertas_sos').set({ status: 'ATIVO', timestamp: Date.now() }); }
        function pararSOS() { db.ref('alertas_sos').set({ status: 'INATIVO', timestamp: Date.now() }); }
        function escutarSOS() {
            db.ref('alertas_sos').on('value', (snap) => {
                const d = snap.val();
                if (d && d.status === 'ATIVO') { tocarSirene(); document.body.classList.add('sos-active'); document.getElementById('sos-banner').style.display = 'flex'; }
                else { desligarSirene(); }
            });
        }

        // ABAS & AUXILIARES
        function trocarAba(abaId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(abaId).classList.add('active');
        }

        function carregarFoto() {
            db.ref('perfis/' + meuPerfil).on('value', (snap) => {
                if (snap.val() && snap.val().foto) {
                    fotoPerfilUrl = snap.val().foto;
                    document.getElementById('profile-preview').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                    document.getElementById('header-avatar-img').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                }
            });
        }

        function processarFoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image(); img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 150; canvas.height = 150;
                        ctx.drawImage(img, 0, 0, 150, 150);
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        fotoPerfilUrl = base64;
                        db.ref('perfis/' + meuPerfil).set({ foto: base64 });
                    }
                }; reader.readAsDataURL(file);
            }
        }

        function carregarParadas() {
            db.ref('paradas').limitToLast(10).on('value', (snap) => {
                const container = document.getElementById('stops-container');
                container.innerHTML = '';
                snap.forEach((child) => {
                    const item = child.val();
                    const card = document.createElement('div');
                    card.className = 'stop-card';
                    card.innerHTML = `<div style="font-weight:800;">${item.usuario}</div><div style="font-size:0.75rem; color:#cbd5e1;">${item.endereco || 'Parada registrada'}</div>`;
                    container.prepend(card);
                });
            });
        }

        function atualizarDistancia() {
            if (minhaUltimaPos && parceiroUltimaPos) {
                const d = calcularDistancia(minhaUltimaPos[0], minhaUltimaPos[1], parceiroUltimaPos[0], parceiroUltimaPos[1]);
                document.getElementById('stat-dist').innerText = d > 1000 ? `${(d/1000).toFixed(1)} km` : `${d.toFixed(0)} m`;
            }
        }

        document.getElementById('btn-recenter').onclick = () => { if (minhaUltimaPos) map.flyTo(minhaUltimaPos, 16); };
        document.getElementById('btn-fit-all').onclick = () => {
            if (minhaUltimaPos && parceiroUltimaPos) {
                map.fitBounds(L.latLngBounds([minhaUltimaPos, parceiroUltimaPos]), { padding: [50, 50] });
            }
        };

        const sidebar = document.getElementById('sidebar');
        document.getElementById('btn-sidebar').onclick = () => sidebar.classList.add('open');
        document.getElementById('btn-close-sidebar').onclick = () => sidebar.classList.remove('open');
    </script>
</body>
</html>
