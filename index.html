<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeCasal 360 - Rastreamento Profissional</title>

    <!-- Configurações PWA e Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <!-- Stylesheets: Leaflet, FontAwesome e Google Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-light: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-dark); color: white; }

        /* TELA DE LOGIN PROFISSIONAL */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.75); border: 1px solid var(--border-light);
            padding: 35px 30px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); backdrop-filter: blur(16px);
        }
        .login-card .brand-icon {
            width: 65px; height: 65px; background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 1.8rem; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
        .login-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.5px; }
        .login-card p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { font-size: 0.75rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border-light);
            background: rgba(15, 23, 42, 0.6); color: white; outline: none; font-size: 0.95rem; transition: all 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        .btn-primary {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:active { transform: scale(0.98); }

        /* MAPA 2D LIMPO E ULTRA FLUIDO */
        #map { width: 100%; height: 100%; flex: 1; z-index: 1; }

        /* HUD SUPERIOR COMPACTA ESTILO LIFE360 */
        .glass-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--card-bg); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 40px; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 92%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header-profile { display: flex; align-items: center; gap: 10px; }
        .header-avatar {
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--primary);
            background-size: cover; background-position: center;
        }
        
        .btn-sos-header {
            padding: 8px 16px; border-radius: 30px; background: var(--danger); color: white;
            border: 2px solid #fca5a5; font-size: 0.8rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); animation: pulse-sos 1.5s infinite;
        }
        @keyframes pulse-sos {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* BANNER SOS ATIVO COM BOTÃO DE DESATIVAR */
        #sos-banner {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 1001; background: var(--danger); color: white; padding: 10px 20px; border-radius: 30px;
            display: none; align-items: center; gap: 15px; font-weight: 800; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6); border: 2px solid #fff;
        }
        body.sos-active { animation: siren-flash 0.5s infinite alternate !important; }
        @keyframes siren-flash { 0% { background: #7f1d1d; } 100% { background: #1e3a8a; } }

        /* MARCADOR NO MAPA COM STATUS DE BATERIA E TRANSPORTE */
        .life-marker {
            position: relative; width: 56px; height: 56px; border-radius: 50%;
            border: 3px solid var(--primary); background-size: cover; background-position: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s;
        }
        .life-marker.parceiro { border-color: #3b82f6; }
        .marker-badge {
            position: absolute; bottom: -2px; right: -2px; background: #10b981; color: white;
            width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; display: flex;
            align-items: center; justify-content: center; border: 2px solid #0f172a;
        }
        .battery-badge {
            position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); color: #fff; padding: 1px 6px; border-radius: 8px;
            font-size: 0.6rem; font-weight: 700; border: 1px solid var(--border-light); display: flex; align-items: center; gap: 3px;
        }

        /* CONTROLES FLUTUANTES */
        .controls-bar { position: absolute; bottom: 105px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .btn-round {
            width: 46px; height: 46px; border-radius: 50%; background: var(--card-bg);
            border: 1px solid var(--border-light); color: white; backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }
        .btn-round:active { transform: scale(0.92); }

        /* PAINEL DE MONITORAMENTO INFERIOR (LIFE360 HUD) */
        .hud-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--card-bg); backdrop-filter: blur(16px);
            padding: 12px 20px; border-radius: 24px; border: 1px solid var(--border-light);
            display: flex; justify-content: space-around; align-items: center;
            width: 92%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 0.65rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
        .hud-value { font-size: 1.1rem; font-weight: 800; color: #fff; }

        /* ABA LATERAL (SIDEBAR) COMPLETA */
        .sidebar {
            position: fixed; top: 0; right: -380px; width: 340px; height: 100%;
            background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(20px); z-index: 3000;
            border-left: 1px solid var(--border-light); padding: 25px 20px;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 20px;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
        }
        .sidebar.open { right: 0 !important; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }

        .profile-upload-card {
            background: rgba(30, 41, 59, 0.6); padding: 15px; border-radius: 20px;
            border: 1px solid var(--border-light); display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .profile-img-preview {
            width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--primary);
            background-size: cover; background-position: center; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .section-title { font-size: 0.8rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-card {
            background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px; border-radius: 14px; font-size: 0.85rem; display: flex; align-items: center; gap: 12px;
        }
        .history-icon {
            width: 38px; height: 38px; border-radius: 12px; background: rgba(99, 102, 241, 0.15);
            color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DESIGN PROFISSIONAL -->
    <div id="login-screen">
        <div class="login-card">
            <div class="brand-icon"><i class="fa-solid fa-location-crosshairs"></i></div>
            <h2>LifeCasal 360</h2>
            <p>Rastreamento inteligente em tempo real</p>
            
            <div class="input-group">
                <label>Seu Nome de Usuário</label>
                <input type="text" id="login-user" placeholder="Ex: Lucas">
            </div>
            <div class="input-group">
                <label>Sua Senha</label>
                <input type="password" id="login-pass" placeholder="******">
            </div>
            <div class="input-group">
                <label>Perfil no App</label>
                <select id="login-perfil">
                    <option value="pessoa1">Pessoa 1 💖</option>
                    <option value="pessoa2">Pessoa 2 💙</option>
                </select>
            </div>
            <button class="btn-primary" onclick="autenticarUsuario()">Entrar no Círculo</button>
            <div id="login-error" style="color:var(--danger); font-size:0.8rem; margin-top:12px; font-weight:600;"></div>
        </div>
    </div>

    <!-- HUD SUPERIOR -->
    <div class="glass-header">
        <div class="header-profile">
            <div class="header-avatar" id="header-avatar-img"></div>
            <div>
                <div id="label-usuario" style="font-weight:800; font-size:0.85rem;">Carregando...</div>
                <div id="status-rede" style="font-size:0.65rem; color:var(--success); display:flex; align-items:center; gap:4px;">
                    <i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Conectado
                </div>
            </div>
        </div>
        <button class="btn-sos-header" onclick="dispararSOS()">SOS 🚨</button>
    </div>

    <!-- BANNER SOS ATIVO -->
    <div id="sos-banner">
        <span>🚨 EMERGÊNCIA ATIVADA!</span>
        <button onclick="pararSOS()" style="background:#fff; color:var(--danger); border:none; padding:6px 14px; border-radius:20px; font-weight:800; cursor:pointer;">PARAR</button>
    </div>

    <!-- MAPA 2D LIMPO -->
    <div id="map"></div>

    <!-- CONTROLES FLUTUANTES DA TELA -->
    <div class="controls-bar">
        <button class="btn-round" id="btn-recenter" title="Minha Localização"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="btn-round" id="btn-fit-all" title="Ver Casal"><i class="fa-solid fa-users"></i></button>
        <button class="btn-round" id="btn-sidebar" title="Configurações"><i class="fa-solid fa-gear"></i></button>
    </div>

    <!-- MONITORAMENTO EM TEMPO REAL (HUD HUD-BOTTOM) -->
    <div class="hud-bottom">
        <div class="hud-item">
            <div class="hud-value" id="stat-speed">0 <span style="font-size:0.7rem;">km/h</span></div>
            <div class="hud-label">Velocidade</div>
        </div>
        <div style="width:1px; height:25px; background:var(--border-light);"></div>
        <div class="hud-item">
            <div class="hud-value" id="stat-mode" style="color:#6366f1;"><i class="fa-solid fa-person-walking"></i></div>
            <div class="hud-label" id="stat-mode-text">Parado</div>
        </div>
        <div style="width:1px; height:25px; background:var(--border-light);"></div>
        <div class="hud-item">
            <div class="hud-value" id="stat-dist" style="color:var(--success);">0 m</div>
            <div class="hud-label">Distância</div>
        </div>
    </div>

    <!-- MENU LATERAL COMPLETO COM CONFIGURAÇÕES -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 style="font-weight:800; font-size:1.1rem;">Configurações</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:1.3rem; color:#94a3b8;" id="btn-close-sidebar"></i>
        </div>

        <div class="profile-upload-card">
            <div class="profile-img-preview" id="profile-preview"></div>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="processarFoto(event)">
            <button class="btn-primary" style="padding:10px; font-size:0.8rem;" onclick="document.getElementById('file-input').click()">📷 Alterar Foto de Perfil</button>
        </div>

        <div class="section-title">Histórico de Lugares / Paradas</div>
        <div class="history-list" id="stops-container"></div>

        <button class="btn-primary" style="background:var(--danger); margin-top:auto;" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button>
    </div>

    <!-- Scripts CDN Leaflet & Firebase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Configuração
        const firebaseConfig = {
            apiKey: "AIzaSyDm3HCp_dc6C1an3qdiYKrNHAjvjnhSe3U",
            authDomain: "nosso-gps.firebaseapp.com",
            databaseURL: "https://nosso-gps-default-rtdb.firebaseio.com",
            projectId: "nosso-gps",
            storageBucket: "nosso-gps.firebasestorage.app",
            messagingSenderId: "311157140126",
            appId: "1:311157140126:web:01a483db11a6d9b24fe98f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let meuPerfil = 'pessoa1', parceiroPerfil = 'pessoa2', meuUsuario = '';
        let meuMarcador = null, marcadorParceiro = null;
        let minhaUltimaPos = null, parceiroUltimaPos = null;
        let fotoPerfilUrl = '', bateriaNivel = 100;

        // 2. MAPA 2D LIMPO, MODERNO E HD (CartoDB Voyager)
        const map = L.map('map', { zoomControl: false }).setView([-14.2350, -51.9253], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB', maxZoom: 19
        }).addTo(map);

        // 3. Monitoramento de Bateria Real do Dispositivo
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                bateriaNivel = Math.round(battery.level * 100);
                battery.addEventListener('levelchange', () => {
                    bateriaNivel = Math.round(battery.level * 100);
                });
            });
        }

        // 4. Autenticação Direta por Usuário/Senha
        function autenticarUsuario() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            meuPerfil = document.getElementById('login-perfil').value;
            parceiroPerfil = meuPerfil === 'pessoa1' ? 'pessoa2' : 'pessoa1';

            if (!user || !pass) {
                document.getElementById('login-error').innerText = "Informe o usuário e a senha!";
                return;
            }

            db.ref('usuarios/' + user).once('value', (snap) => {
                const dados = snap.val();
                if (dados && dados.senha !== pass) {
                    document.getElementById('login-error').innerText = "Senha incorreta!";
                    return;
                }
                if (!dados) db.ref('usuarios/' + user).set({ senha: pass, perfil: meuPerfil });

                meuUsuario = user;
                localStorage.setItem('life_user', user);
                localStorage.setItem('life_perfil', meuPerfil);

                document.getElementById('label-usuario').innerText = `${user} (${meuPerfil === 'pessoa1' ? '💖' : '💙'})`;
                document.getElementById('login-screen').style.display = 'none';

                iniciarRastreamentoGPS();
                escutarParceiro();
                escutarSOS();
                carregarFoto();
                carregarParadas();
            });
        }

        function fazerLogout() { localStorage.clear(); location.reload(); }
        if (localStorage.getItem('life_user')) {
            document.getElementById('login-user').value = localStorage.getItem('life_user');
            document.getElementById('login-perfil').value = localStorage.getItem('life_perfil') || 'pessoa1';
        }

        // 5. Automação de Reconhecimento por Velocidade / Modo de Transporte
        function detectarTransporte(v) {
            if (v < 2) return { modo: 'Parado', icone: 'fa-person-walking' };
            if (v <= 15) return { modo: 'Caminhando', icone: 'fa-person-walking' };
            if (v <= 35) return { modo: 'Moto/Bike', icone: 'fa-motorcycle' };
            return { modo: 'Dirigindo', icone: 'fa-car' };
        }

        // 6. Marcador do Mapa Estilo Life360 (Foto + Bateria + Transporte)
        function criarMarcadorLife(urlFoto, modoIcone, bat, eParceiro = false) {
            const img = urlFoto || `https://ui-avatars.com/api/?name=${eParceiro?'Amor':'Voce'}&background=${eParceiro?'3b82f6':'6366f1'}&color=fff`;
            return L.divIcon({
                className: 'custom-icon-wrapper',
                html: `<div class="life-marker ${eParceiro ? 'parceiro' : ''}" style="background-image: url('${img}');">
                        <div class="battery-badge"><i class="fa-solid fa-battery-three-quarters"></i> ${bat}%</div>
                        <div class="marker-badge"><i class="fa-solid ${modoIcone}"></i></div>
                       </div>`,
                iconSize: [56, 56], iconAnchor: [28, 28]
            });
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 7. Rastreamento Continuo de GPS
        let tempoParado = null;

        function iniciarRastreamentoGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude, prec = pos.coords.accuracy;
                    if (prec > 35) return; // Filtro de precisão

                    let v = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
                    const infoTransp = detectarTransporte(v);
                    minhaUltimaPos = [lat, lng];

                    document.getElementById('stat-speed').innerHTML = `${v.toFixed(0)} <span style="font-size:0.7rem;">km/h</span>`;
                    document.getElementById('stat-mode').innerHTML = `<i class="fa-solid ${infoTransp.icone}"></i>`;
                    document.getElementById('stat-mode-text').innerText = infoTransp.modo;

                    if (!meuMarcador) {
                        meuMarcador = L.marker([lat, lng], { icon: criarMarcadorLife(fotoPerfilUrl, infoTransp.icone, bateriaNivel) }).addTo(map);
                        map.setView([lat, lng], 16);
                    } else {
                        meuMarcador.setLatLng([lat, lng]);
                        meuMarcador.setIcon(criarMarcadorLife(fotoPerfilUrl, infoTransp.icone, bateriaNivel));
                    }

                    // Grava Parada no Histórico se ficar parado mais de 3 minutos
                    if (v < 2) {
                        if (!tempoParado) tempoParado = Date.now();
                        else if (Date.now() - tempoParado > 180000) {
                            db.ref('paradas').push({ usuario: meuUsuario, lat: lat, lng: lng, hora: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
                            tempoParado = null;
                        }
                    } else { tempoParado = null; }

                    db.ref('casal/' + meuPerfil).set({
                        lat: lat, lng: lng, speed: v, modoIcone: infoTransp.icone,
                        foto: fotoPerfilUrl, bateria: bateriaNivel, timestamp: Date.now()
                    });

                    atualizarDistancia();
                }, (err) => console.error(err), { enableHighAccuracy: true, maximumAge: 1000 });
            }
        }

        function escutarParceiro() {
            db.ref('casal/' + parceiroPerfil).on('value', (snap) => {
                const dados = snap.val();
                if (!dados || !dados.lat) return;

                parceiroUltimaPos = [dados.lat, dados.lng];
                if (!marcadorParceiro) {
                    marcadorParceiro = L.marker([dados.lat, dados.lng], { icon: criarMarcadorLife(dados.foto, dados.modoIcone || 'fa-person-walking', dados.bateria || 100, true) }).addTo(map);
                } else {
                    marcadorParceiro.setLatLng([dados.lat, dados.lng]);
                    marcadorParceiro.setIcon(criarMarcadorLife(dados.foto, dados.modoIcone || 'fa-person-walking', dados.bateria || 100, true));
                }
                atualizarDistancia();
            });
        }

        // 8. Sirene e Alerta SOS Sincronizado
        let audioCtx = null, sirenOsc = null, sirenInterval = null;
        function tocarSirene() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            sirenOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            sirenOsc.type = 'sawtooth'; sirenOsc.connect(gain); gain.connect(audioCtx.destination); sirenOsc.start();
            sirenInterval = setInterval(() => {
                if (sirenOsc && audioCtx) {
                    sirenOsc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    sirenOsc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
                }
            }, 500);
        }
        function desligarSirene() {
            if (sirenOsc) { sirenOsc.stop(); sirenOsc.disconnect(); sirenOsc = null; }
            if (sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
            document.body.classList.remove('sos-active');
            document.getElementById('sos-banner').style.display = 'none';
        }

        function dispararSOS() { db.ref('alertas_sos').set({ status: 'ATIVO', timestamp: Date.now() }); }
        function pararSOS() { db.ref('alertas_sos').set({ status: 'INATIVO', timestamp: Date.now() }); }
        function escutarSOS() {
            db.ref('alertas_sos').on('value', (snap) => {
                const dados = snap.val();
                if (dados && dados.status === 'ATIVO') {
                    tocarSirene();
                    document.body.classList.add('sos-active');
                    document.getElementById('sos-banner').style.display = 'flex';
                } else { desligarSirene(); }
            });
        }

        // 9. Fotos e Histórico no Firebase
        function processarFoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image(); img.src = evt.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        canvas.width = 150; canvas.height = 150;
                        ctx.drawImage(img, 0, 0, 150, 150);
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        fotoPerfilUrl = base64;
                        document.getElementById('profile-preview').style.backgroundImage = `url('${base64}')`;
                        document.getElementById('header-avatar-img').style.backgroundImage = `url('${base64}')`;
                        db.ref('perfis/' + meuPerfil).set({ foto: base64 });
                    }
                }; reader.readAsDataURL(file);
            }
        }
        function carregarFoto() {
            db.ref('perfis/' + meuPerfil).on('value', (snap) => {
                if (snap.val() && snap.val().foto) {
                    fotoPerfilUrl = snap.val().foto;
                    document.getElementById('profile-preview').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                    document.getElementById('header-avatar-img').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                }
            });
        }
        function carregarParadas() {
            db.ref('paradas').limitToLast(10).on('value', (snap) => {
                const container = document.getElementById('stops-container');
                container.innerHTML = '';
                snap.forEach((child) => {
                    const item = child.val();
                    const card = document.createElement('div');
                    card.className = 'history-card';
                    card.innerHTML = `
                        <div class="history-icon"><i class="fa-solid fa-location-dot"></i></div>
                        <div>
                            <div style="font-weight:700;">${item.usuario} parou aqui</div>
                            <div style="font-size:0.75rem; color:#94a3b8;">Às ${item.hora}</div>
                        </div>
                    `;
                    container.prepend(card);
                });
            });
        }

        function atualizarDistancia() {
            if (minhaUltimaPos && parceiroUltimaPos) {
                const d = calcularDistancia(minhaUltimaPos[0], minhaUltimaPos[1], parceiroUltimaPos[0], parceiroUltimaPos[1]);
                document.getElementById('stat-dist').innerText = d > 1000 ? `${(d/1000).toFixed(1)} km` : `${d.toFixed(0)} m`;
            }
        }

        // Controles de Clique e Ajuste de Tela
        document.getElementById('btn-recenter').onclick = () => { if (minhaUltimaPos) map.flyTo(minhaUltimaPos, 16); };
        document.getElementById('btn-fit-all').onclick = () => {
            if (minhaUltimaPos && parceiroUltimaPos) {
                const bounds = L.latLngBounds([minhaUltimaPos, parceiroUltimaPos]);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        };

        const sidebar = document.getElementById('sidebar');
        document.getElementById('btn-sidebar').onclick = () => sidebar.classList.add('open');
        document.getElementById('btn-close-sidebar').onclick = () => sidebar.classList.remove('open');
    </script>
</body>
</html>
