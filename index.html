<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeCasal 360 - Waze Edition</title>

    <!-- Meta Tags PWA / iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#334155">

    <!-- Leaflet, FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --waze-blue: #3388ff;
            --waze-yellow: #fbbc04;
            --waze-red: #ea4335;
            --waze-green: #34a853;
            --bg-dark: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.94);
            --border-light: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #0f172a; color: white; }

        /* TELA DE LOGIN */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at top right, #3b82f6, #0f172a);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-light);
            padding: 35px 30px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); backdrop-filter: blur(16px);
        }
        .login-card .brand-icon {
            width: 70px; height: 70px; background: linear-gradient(135deg, var(--waze-blue), #60a5fa);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 2rem; box-shadow: 0 10px 25px rgba(51, 136, 255, 0.4);
        }
        .login-card h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 5px; }
        .login-card p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { font-size: 0.75rem; font-weight: 800; color: #cbd5e1; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border-light);
            background: rgba(15, 23, 42, 0.7); color: white; outline: none; font-size: 0.95rem;
        }
        .btn-primary {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--waze-blue), #2563eb);
            color: white; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(51, 136, 255, 0.4);
        }

        /* MAPA ESTILO WAZE */
        #map { width: 100%; height: 100%; flex: 1; z-index: 1; }

        /* HUD SUPERIOR */
        .glass-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: var(--card-bg); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 40px; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            width: 92%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .header-profile { display: flex; align-items: center; gap: 10px; }
        .header-avatar {
            width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--waze-blue);
            background-size: cover; background-position: center;
        }
        .btn-sos-header {
            padding: 8px 16px; border-radius: 30px; background: var(--waze-red); color: white;
            border: 2px solid #fca5a5; font-size: 0.8rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 15px rgba(234, 67, 53, 0.6); animation: pulse-sos 1.5s infinite;
        }
        @keyframes pulse-sos { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* BANNER DE EXCESSO DE VELOCIDADE OU RADAR */
        #traffic-alert-banner {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            z-index: 1001; background: var(--waze-red); color: white; padding: 10px 20px; border-radius: 30px;
            display: none; align-items: center; gap: 10px; font-weight: 800; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(234, 67, 53, 0.7); border: 2px solid #fff;
            animation: bounceAlert 0.4s ease infinite alternate;
        }
        @keyframes bounceAlert { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-5px); } }

        /* VELOCÍMETRO WAZE HUD */
        .speedometer-waze {
            position: absolute; bottom: 95px; left: 20px; z-index: 1000;
            width: 75px; height: 75px; border-radius: 50%; background: #0f172a;
            border: 4px solid var(--waze-blue); display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .speedometer-waze.overspeed {
            border-color: var(--waze-red) !important; background: var(--waze-red) !important;
            animation: pulseSpeed 0.5s infinite alternate;
        }
        @keyframes pulseSpeed { from { transform: scale(1); } to { transform: scale(1.1); } }
        .speed-number { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; line-height: 1; }
        .speed-unit { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-top: 2px; }

        /* BOTÕES FLUTUANTES */
        .controls-bar { position: absolute; bottom: 95px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .btn-round {
            width: 48px; height: 48px; border-radius: 50%; background: var(--card-bg);
            border: 1px solid var(--border-light); color: white; backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s;
        }

        /* PAINEL LATERAL MULTI-ABAS */
        .sidebar {
            position: fixed; top: 0; right: -420px; width: 380px; height: 100%;
            background: rgba(15, 23, 42, 0.97); backdrop-filter: blur(20px); z-index: 3000;
            border-left: 1px solid var(--border-light); padding: 20px;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 15px;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
        }
        .sidebar.open { right: 0 !important; }

        .tab-menu { display: flex; gap: 4px; background: rgba(30, 41, 59, 0.8); padding: 4px; border-radius: 14px; border: 1px solid var(--border-light); }
        .tab-btn { flex: 1; padding: 8px 2px; border: none; background: none; color: #94a3b8; font-weight: 700; font-size: 0.7rem; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: var(--waze-blue); color: #fff; }

        .tab-content { display: none; flex: 1; flex-direction: column; gap: 12px; overflow-y: auto; }
        .tab-content.active { display: flex; }

        /* ÍCONES DE RADAR E SEMÁFORO NO MAPA */
        .radar-icon-map {
            width: 32px; height: 32px; border-radius: 50%; background: var(--waze-red); color: white;
            border: 2px solid white; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; box-shadow: 0 0 12px rgba(234, 67, 53, 0.8);
        }
        .traffic-light-icon {
            width: 34px; height: 34px; border-radius: 12px; background: #000; color: white;
            border: 2px solid var(--border-light); display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* CHAT estilo WHATSAPP */
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 5px; }
        .msg-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.85rem; line-height: 1.35; position: relative; }
        .msg-bubble .sender-name { font-size: 0.7rem; font-weight: 800; margin-bottom: 3px; color: #93c5fd; }
        .msg-bubble .meta { font-size: 0.65rem; opacity: 0.75; text-align: right; margin-top: 4px; }
        .msg-bubble.me { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-bubble.other { background: rgba(30, 41, 59, 0.95); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-light); }
        .chat-input-box { display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border-light); background: rgba(15, 23, 42, 0.8); color: white; outline: none; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <div class="brand-icon"><i class="fa-solid fa-car-side"></i></div>
            <h2>LifeCasal - Waze</h2>
            <p>Trânsito, Radares e Semáforos em Tempo Real</p>
            
            <div class="input-group">
                <label>Nome de Usuário</label>
                <input type="text" id="login-user" placeholder="Ex: Lucas">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="login-pass" placeholder="******">
            </div>
            <div class="input-group">
                <label>Perfil no App</label>
                <select id="login-perfil">
                    <option value="pessoa1">Pessoa 1 💖</option>
                    <option value="pessoa2">Pessoa 2 💙</option>
                </select>
            </div>
            <button class="btn-primary" onclick="autenticarUsuario()">Iniciar Navegação</button>
            <div id="login-error" style="color:var(--waze-red); font-size:0.8rem; margin-top:12px; font-weight:600;"></div>
        </div>
    </div>

    <!-- HUD SUPERIOR -->
    <div class="glass-header">
        <div class="header-profile">
            <div class="header-avatar" id="header-avatar-img"></div>
            <div>
                <div id="label-usuario" style="font-weight:800; font-size:0.85rem;">Conectando...</div>
                <div id="status-rede" style="font-size:0.65rem; color:var(--waze-green); display:flex; align-items:center; gap:4px;">
                    <i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Modo Waze Ativo
                </div>
            </div>
        </div>
        <button class="btn-sos-header" onclick="dispararSOS()">SOS 🚨</button>
    </div>

    <!-- BANNER ALERTA DE RADAR / VELOCIDADE -->
    <div id="traffic-alert-banner">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="traffic-alert-text">Atenção: Radar à frente!</span>
    </div>

    <!-- VELOCÍMETRO WAZE -->
    <div class="speedometer-waze" id="speedometer-box">
        <div class="speed-number" id="speed-val">0</div>
        <div class="speed-unit">KM/H</div>
    </div>

    <!-- MAPA WAZE -->
    <div id="map"></div>

    <!-- CONTROLES -->
    <div class="controls-bar">
        <button class="btn-round" id="btn-recenter" title="Minha Posição"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="btn-round" onclick="carregarRadaresECameras()" title="Buscar Radares"><i class="fa-solid fa-camera"></i></button>
        <button class="btn-round" id="btn-sidebar" title="Menu e Painel"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- PAINEL LATERAL MULTI-ABAS -->
    <div class="sidebar" id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-weight:800; font-size:1.1rem;">Painel de Navegação</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:1.3rem; color:#94a3b8;" id="btn-close-sidebar"></i>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="trocarAba('tab-waze', this)">Waze 🚗</button>
            <button class="tab-btn" onclick="trocarAba('tab-lugares', this)">Lugares 🏠</button>
            <button class="tab-btn" onclick="trocarAba('tab-chat', this)">Chat 💬</button>
            <button class="tab-btn" onclick="trocarAba('tab-config', this)">Perfil 👤</button>
        </div>

        <!-- ABA WAZE E TRÂNSITO -->
        <div class="tab-content active" id="tab-waze">
            <div class="input-group">
                <label>Limite Max. de Velocidade da Via (KM/H)</label>
                <input type="number" id="input-max-speed" value="60" onchange="limiteVelocidadeMax = parseInt(this.value)">
            </div>
            <button class="btn-primary" onclick="carregarRadaresECameras()"><i class="fa-solid fa-camera"></i> Escanear Radares da Região</button>
            <div style="font-size:0.75rem; color:#94a3b8; margin-top:5px;">O sistema analisa radares de velocidade e calcula a contagem de semáforos próximos.</div>
        </div>

        <!-- ABA LUGARES -->
        <div class="tab-content" id="tab-lugares">
            <button class="btn-primary" onclick="cadastrarLugarModoPrompt()"><i class="fa-solid fa-location-dot"></i> Salvar Lugar no Mapa</button>
            <div id="places-container" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;"></div>
        </div>

        <!-- ABA CHAT -->
        <div class="tab-content" id="tab-chat">
            <div class="chat-messages" id="chat-container"></div>
            <div class="chat-input-box">
                <input type="text" id="chat-input" placeholder="Mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
                <button class="btn-primary" style="width:auto; padding:0 16px; margin:0;" onclick="enviarMensagem()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- ABA PERFIL -->
        <div class="tab-content" id="tab-config">
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; background:rgba(30,41,59,0.5); padding:15px; border-radius:18px;">
                <div id="profile-preview" style="width:80px; height:80px; border-radius:50%; border:3px solid var(--waze-blue); background-size:cover; background-position:center;"></div>
                <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="processarFoto(event)">
                <button class="btn-primary" style="padding:8px; font-size:0.8rem;" onclick="document.getElementById('file-input').click()">📷 Alterar Foto</button>
            </div>
            <button class="btn-primary" style="background:var(--waze-red); margin-top:auto;" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair da Conta</button>
        </div>
    </div>

    <!-- Leaflet & Firebase SDKs -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDm3HCp_dc6C1an3qdiYKrNHAjvjnhSe3U",
            authDomain: "nosso-gps.firebaseapp.com",
            databaseURL: "https://nosso-gps-default-rtdb.firebaseio.com",
            projectId: "nosso-gps",
            storageBucket: "nosso-gps.firebasestorage.app",
            messagingSenderId: "311157140126",
            appId: "1:311157140126:web:01a483db11a6d9b24fe98f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let meuPerfil = 'pessoa1', parceiroPerfil = 'pessoa2', meuUsuario = '';
        let meuMarcador = null, marcadorParceiro = null;
        let minhaUltimaPos = null, parceiroUltimaPos = null;
        let fotoPerfilUrl = '', bateriaNivel = 100;
        let limiteVelocidadeMax = 60;
        let camadaRadares = L.layerGroup(), camadaSemaforos = L.layerGroup();
        let listaRadaresProximos = [];

        // 2. MAPA ESTILO WAZE (CartoDB Voyager)
        const map = L.map('map', { zoomControl: false }).setView([-14.2350, -51.9253], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap / CartoDB / Waze Style', maxZoom: 19
        }).addTo(map);

        camadaRadares.addTo(map);
        camadaSemaforos.addTo(map);

        // Bateria
        if ('getBattery' in navigator) {
            navigator.getBattery().then(b => {
                bateriaNivel = Math.round(b.level * 100);
                b.addEventListener('levelchange', () => { bateriaNivel = Math.round(b.level * 100); });
            });
        }

        // Login
        function autenticarUsuario() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            meuPerfil = document.getElementById('login-perfil').value;
            parceiroPerfil = meuPerfil === 'pessoa1' ? 'pessoa2' : 'pessoa1';

            if (!user || !pass) {
                document.getElementById('login-error').innerText = "Informe usuário e senha!";
                return;
            }

            db.ref('usuarios/' + user).once('value', (snap) => {
                const d = snap.val();
                if (d && d.senha !== pass) {
                    document.getElementById('login-error').innerText = "Senha incorreta!";
                    return;
                }
                if (!d) db.ref('usuarios/' + user).set({ senha: pass, perfil: meuPerfil });

                meuUsuario = user;
                localStorage.setItem('life_user', user);
                localStorage.setItem('life_perfil', meuPerfil);

                document.getElementById('label-usuario').innerText = `${user} (${meuPerfil === 'pessoa1' ? '💖' : '💙'})`;
                document.getElementById('login-screen').style.display = 'none';

                iniciarRastreamentoGPS();
                escutarParceiro();
                escutarSOS();
                escutarChat();
                carregarFoto();
                iniciarCicloSemaforosRegressivos();
            });
        }

        function fazerLogout() { localStorage.clear(); location.reload(); }
        if (localStorage.getItem('life_user')) {
            document.getElementById('login-user').value = localStorage.getItem('life_user');
            document.getElementById('login-perfil').value = localStorage.getItem('life_perfil') || 'pessoa1';
        }

        // 3. API OVERPASS - CONSULTAR RADARES E SEMÁFOROS
        async function carregarRadaresECameras() {
            if (!minhaUltimaPos) return;
            const lat = minhaUltimaPos[0];
            const lng = minhaUltimaPos[1];

            // Busca elementos em um raio de 2.5km
            const query = `[out:json];(node["highway"="speed_camera"](around:2500,${lat},${lng});node["highway"="traffic_signals"](around:1500,${lat},${lng}););out;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                camadaRadares.clearLayers();
                camadaSemaforos.clearLayers();
                listaRadaresProximos = [];

                const res = await fetch(url);
                const data = await res.json();

                if (data && data.elements) {
                    data.elements.forEach(item => {
                        if (item.tags.highway === 'speed_camera') {
                            listaRadaresProximos.push({ lat: item.lat, lng: item.lon });
                            const radarIcon = L.divIcon({
                                className: 'custom-radar',
                                html: `<div class="radar-icon-map"><i class="fa-solid fa-camera"></i></div>`,
                                iconSize: [32, 32], iconAnchor: [16, 16]
                            });
                            L.marker([item.lat, item.lon], { icon: radarIcon }).addTo(camadaRadares)
                             .bindPopup("<b>Radar de Velocidade</b><br>Respeite o limite!");
                        } else if (item.tags.highway === 'traffic_signals') {
                            desenharSemaforoNoMapa(item.lat, item.lon);
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }

        // 4. CONTAGEM REGRESSIVA DE SEMÁFOROS
        let semaforosMapa = [];
        function desenharSemaforoNoMapa(lat, lng) {
            const semIcon = L.divIcon({
                className: 'custom-sem',
                html: `<div class="traffic-light-icon" id="sem-${lat.toString().replace('.','')}">
                        <i class="fa-solid fa-circle" style="color:#34a853; font-size:0.6rem;"></i>
                        <span style="font-size:0.6rem;" class="timer-val">15</span>
                       </div>`,
                iconSize: [34, 34], iconAnchor: [17, 17]
            });
            const marker = L.marker([lat, lng], { icon: semIcon }).addTo(camadaSemaforos);
            semaforosMapa.push({ lat, lng, tempoVerde: 20, tempoVermelho: 15, estadoAtual: 'VERDE', tempoRestante: 20, elementId: `sem-${lat.toString().replace('.','')}` });
        }

        function iniciarCicloSemaforosRegressivos() {
            setInterval(() => {
                semaforosMapa.forEach(s => {
                    s.tempoRestante--;
                    if (s.tempoRestante <= 0) {
                        s.estadoAtual = s.estadoAtual === 'VERDE' ? 'VERMELHO' : 'VERDE';
                        s.tempoRestante = s.estadoAtual === 'VERDE' ? s.tempoVerde : s.tempoVermelho;
                    }
                    const el = document.getElementById(s.elementId);
                    if (el) {
                        const cor = s.estadoAtual === 'VERDE' ? '#34a853' : '#ea4335';
                        el.innerHTML = `<i class="fa-solid fa-circle" style="color:${cor}; font-size:0.6rem;"></i><span style="font-size:0.6rem;">${s.tempoRestante}s</span>`;
                    }
                });
            }, 1000);
        }

        // 5. CHECAGEM DE EXCESSO DE VELOCIDADE E RADAR PRÓXIMO
        function verificarAlertasVelocidadeERadar(vKmh) {
            const speedBox = document.getElementById('speedometer-box');
            const alertBanner = document.getElementById('traffic-alert-banner');
            const alertText = document.getElementById('traffic-alert-text');

            document.getElementById('speed-val').innerText = vKmh.toFixed(0);

            // Alerta de Excesso de Velocidade
            if (vKmh > limiteVelocidadeMax) {
                speedBox.classList.add('overspeed');
                alertText.innerText = `Atenção: Excesso de velocidade (${vKmh.toFixed(0)} km/h)!`;
                alertBanner.style.display = 'flex';
                return;
            } else {
                speedBox.classList.remove('overspeed');
            }

            // Alerta de Radar Próximo (Menos de 200 metros)
            let radarProximo = false;
            if (minhaUltimaPos) {
                listaRadaresProximos.forEach(r => {
                    const d = calcularDistancia(minhaUltimaPos[0], minhaUltimaPos[1], r.lat, r.lng);
                    if (d < 200) radarProximo = true;
                });
            }

            if (radarProximo) {
                alertText.innerText = "Radar de Velocidade a 200m!";
                alertBanner.style.display = 'flex';
            } else if (vKmh <= limiteVelocidadeMax) {
                alertBanner.style.display = 'none';
            }
        }

        // 6. GPS E RASTREAMENTO
        function criarMarcadorLife(urlFoto, modoIcone, bat, eParceiro = false) {
            const img = urlFoto || `https://ui-avatars.com/api/?name=${eParceiro?'Amor':'Voce'}&background=${eParceiro?'3388ff':'3b82f6'}&color=fff`;
            return L.divIcon({
                className: 'custom-icon-wrapper',
                html: `<div style="position:relative; width:56px; height:56px; border-radius:50%; border:3px solid ${eParceiro?'#3388ff':'#34a853'}; background-image:url('${img}'); background-size:cover;">
                        <div style="position:absolute; top:-5px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:1px 6px; border-radius:8px; font-size:0.6rem; font-weight:800;">${bat}%</div>
                       </div>`,
                iconSize: [56, 56], iconAnchor: [28, 28]
            });
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function iniciarRastreamentoGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude, prec = pos.coords.accuracy;
                    if (prec > 35) return;

                    let v = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
                    minhaUltimaPos = [lat, lng];

                    verificarAlertasVelocidadeERadar(v);

                    if (!meuMarcador) {
                        meuMarcador = L.marker([lat, lng], { icon: criarMarcadorLife(fotoPerfilUrl, 'fa-car', bateriaNivel) }).addTo(map);
                        map.setView([lat, lng], 16);
                        carregarRadaresECameras();
                    } else {
                        meuMarcador.setLatLng([lat, lng]);
                        meuMarcador.setIcon(criarMarcadorLife(fotoPerfilUrl, 'fa-car', bateriaNivel));
                    }

                    db.ref('casal/' + meuPerfil).set({
                        lat: lat, lng: lng, speed: v,
                        foto: fotoPerfilUrl, bateria: bateriaNivel, timestamp: Date.now()
                    });
                }, (err) => console.error(err), { enableHighAccuracy: true });
            }
        }

        function escutarParceiro() {
            db.ref('casal/' + parceiroPerfil).on('value', (snap) => {
                const d = snap.val();
                if (!d || !d.lat) return;

                parceiroUltimaPos = [d.lat, d.lng];
                if (!marcadorParceiro) {
                    marcadorParceiro = L.marker([d.lat, d.lng], { icon: criarMarcadorLife(d.foto, 'fa-car', d.bateria || 100, true) }).addTo(map);
                } else {
                    marcadorParceiro.setLatLng([d.lat, d.lng]);
                    marcadorParceiro.setIcon(criarMarcadorLife(d.foto, 'fa-car', d.bateria || 100, true));
                }
            });
        }

        // 7. CHAT & AUXILIARES
        function enviarMensagem() {
            const input = document.getElementById('chat-input');
            const texto = input.value.trim();
            if (!texto) return;

            const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            db.ref('chat').push({ emissor: meuUsuario, perfil: meuPerfil, mensagem: texto, hora: hora, timestamp: Date.now() });
            input.value = '';
        }

        function escutarChat() {
            db.ref('chat').limitToLast(30).on('value', (snap) => {
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                snap.forEach((child) => {
                    const m = child.val();
                    const isMe = m.perfil === meuPerfil;
                    const bubble = document.createElement('div');
                    bubble.className = `msg-bubble ${isMe ? 'me' : 'other'}`;
                    bubble.innerHTML = `<div class="sender-name">${isMe ? 'Você' : m.emissor}</div><div>${m.mensagem}</div><div class="meta">${m.hora}</div>`;
                    container.appendChild(bubble);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function dispararSOS() { db.ref('alertas_sos').set({ status: 'ATIVO', timestamp: Date.now() }); }
        function pararSOS() { db.ref('alertas_sos').set({ status: 'INATIVO', timestamp: Date.now() }); }
        function escutarSOS() {
            db.ref('alertas_sos').on('value', (snap) => {
                const d = snap.val();
                if (d && d.status === 'ATIVO') alert("🚨 SOS DISPARADO!");
            });
        }

        function trocarAba(abaId, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(abaId).classList.add('active');
        }

        function carregarFoto() {
            db.ref('perfis/' + meuPerfil).on('value', (snap) => {
                if (snap.val() && snap.val().foto) {
                    fotoPerfilUrl = snap.val().foto;
                    document.getElementById('profile-preview').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                    document.getElementById('header-avatar-img').style.backgroundImage = `url('${fotoPerfilUrl}')`;
                }
            });
        }

        function processarFoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64 = evt.target.result;
                    fotoPerfilUrl = base64;
                    db.ref('perfis/' + meuPerfil).set({ foto: base64 });
                }; reader.readAsDataURL(file);
            }
        }

        document.getElementById('btn-recenter').onclick = () => { if (minhaUltimaPos) map.flyTo(minhaUltimaPos, 16); };
        const sidebar = document.getElementById('sidebar');
        document.getElementById('btn-sidebar').onclick = () => sidebar.classList.add('open');
        document.getElementById('btn-close-sidebar').onclick = () => sidebar.classList.remove('open');
    </script>
</body>
